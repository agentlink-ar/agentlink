<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>AgentLink</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="alternate" hreflang="en" href="en/">
  <link rel="alternate" hreflang="es" href="es/">
  <link rel="alternate" hreflang="x-default" href="./">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;background:#0A0F1A;color:#F5F7FB}
    .router{text-align:center;padding:28px}.mark{width:56px;height:56px;object-fit:contain;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 7px}p{margin:0;color:#8F9AAF;font-size:14px}.choices{display:flex;justify-content:center;gap:9px;margin-top:20px}
    .choices a{color:#EAF1FF;text-decoration:none;border:1px solid #29364F;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700}.choices a:hover{border-color:#4C8DFF}
  </style>
  <script>
    (function(){
      var supported = ['en','es'];
      var chosen = null;
      try { chosen = localStorage.getItem('agentlink-language'); } catch (e) {}

      // A previously selected language has priority over automatic detection.
      if (supported.indexOf(chosen) !== -1) {
        location.replace('./' + chosen + '/');
        return;
      }

      var languages = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || 'en'];

      // Spanish browser -> /es/. Everything else -> /en/.
      var useSpanish = languages.some(function(lang){ return /^es(?:-|$)/i.test(lang || ''); });
      location.replace(useSpanish ? './es/' : './en/');
    })();
  </script>
</head>
<body>
  <main class="router">
    <img class="mark" src="logos/agentlink-mark.png" alt="AgentLink">
    <h1>AgentLink</h1>
    <p>Detecting language · Detectando idioma</p>
    <noscript>
      <div class="choices">
        <a href="en/">English</a>
        <a href="es/">Español</a>
      </div>
    </noscript>
  </main>
</body>
</html>
